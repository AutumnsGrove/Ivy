# CI: every push to main and every PR (CI.md section 2). Public repository, so
# all actions are pinned to a full commit SHA, permissions default to read, no
# self-hosted runners and no workflow ever sees a secret. The commands are the
# same `make` targets a human runs locally; there is no CI-only magic.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly CodeQL and govulncheck against fresh advisories (CI.md section 4).
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOFLAGS: -mod=readonly
  # The latest patch of the minor go.mod requires, so a fixed standard-library
  # vulnerability (govulncheck) never outlives the toolchain.
  GO_VERSION: '1.26'

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - name: format
        run: make fmt
      - name: vet
        run: make vet
      - name: staticcheck
        run: make lint
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.12.1
          args: --config .golangci.yml
      - name: build
        run: CGO_ENABLED=0 go build ./...
      # -race needs cgo for its C runtime only; the build and nocgo steps keep our code pure Go.
      - name: test (race, integration through mailworld)
        run: CGO_ENABLED=1 go test -race ./...
      - name: cross-compile for the target architecture
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  nocgo:
    name: nocgo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - name: no package or dependency may need cgo
        run: |
          CGO_ENABLED=0 go list -deps \
            -f '{{if .CgoFiles}}{{.ImportPath}}: {{.CgoFiles}}{{end}}' ./... | tee cgo.txt
          if [ -s cgo.txt ]; then
            echo "::error::dependencies with cgo files are not allowed (pure Go only)"
            exit 1
          fi

  drift:
    name: drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: generated Go and TS types are current
        run: make drift

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: typecheck and unit tests
        run: make web-check
      - name: production build and load budgets
        run: make web-budget

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: install browsers
        run: pnpm exec playwright install --with-deps
        working-directory: web
      - name: phone (WebKit) and desktop (Chromium)
        run: make e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-e2e
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: install browsers
        run: pnpm exec playwright install --with-deps
        working-directory: web
      - name: the real binary serves the embedded build on both viewports
        run: make smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-smoke
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7

  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - name: repo hygiene (generated assets, no live provider in tests)
        run: make guard
      - name: secret scan over the full history
        run: >-
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 detect
          --source . --redact --no-banner --exit-code 1

  deps:
    name: deps
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go builds explicitly: the autobuilder runs the Makefile's first target, `dev`,
          # which starts the dev stack and never exits (every run hung until the 6 h limit).
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          # `languages` (plural) is the real input; the singular was ignored with a warning, so
          # every job auto-detected go, javascript and actions and ran Go's autobuilder.
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'manual'
        name: build for CodeQL
        run: CGO_ENABLED=0 go build ./...
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
