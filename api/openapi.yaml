openapi: 3.1.0
info:
  title: Ivy API
  version: 0.0.1
  description: >
    The typed contract shared by the Go server and the SvelteKit client
    (STANDARDS.md section 6). Go and TypeScript code are generated from this
    file; committed outputs are drift-checked in CI. Only the read surface the
    frontend already calls is described so far; mutations and SSE event bodies
    are added per milestone. SSE event shapes are an extension because OpenAPI
    does not model them natively.
servers:
  - url: /api/v1
paths:
  /version:
    get:
      operationId: getVersion
      summary: The running build version
      responses:
        "200":
          description: Build info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /health:
    get:
      operationId: getLiveness
      summary: Process and database liveness
      responses:
        "200":
          description: All databases reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
        "503":
          description: One or more databases unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /accounts:
    get:
      operationId: listAccounts
      summary: Configured accounts
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      operationId: connectAccount
      summary: Connect a mailbox
      description: >
        Tests the login against the provider, and only if it works stores the
        password (a private file on the server, never a database) and starts
        syncing. The password is never returned. Purelymail is the only
        provider for now, so the server fixes the hosts and the request names
        only the address and password. There is no login on Ivy, so this is open
        to anything that can reach it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectAccount"
      responses:
        "201":
          description: Connected; the first sync has started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccount"
        "400":
          description: The address or password is not valid (`bad_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This address is already connected (`already_connected`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The provider refused the login (`auth_failed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The provider did not answer (`unreachable`), or the test failed for another reason (`connect_failed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: This deployment cannot connect accounts (`connect_unavailable`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /accounts/{id}/password:
    put:
      operationId: updateAccountPassword
      summary: Replace an account's password
      description: >
        Tests the new password first and keeps the old one if it fails. On
        success sync restarts with the new password, which is how an account
        that stopped on `auth_failed` recovers.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePassword"
      responses:
        "204":
          description: Replaced; sync restarted
        "400":
          description: The password is not valid (`bad_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The provider refused the login (`auth_failed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The provider did not answer (`unreachable`), or the test failed for another reason (`connect_failed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: This deployment cannot connect accounts (`connect_unavailable`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /accounts/{id}:
    patch:
      operationId: updateAccountProfile
      summary: Rename an account or choose its icon
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountProfile"
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/NotFound"
  /accounts/{id}/identities:
    get:
      operationId: listIdentities
      summary: The addresses this account may send as
      description: >
        The stored identities plus the account's own address as a synthetic,
        non-deletable primary row.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The identities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityList"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveIdentity
      summary: Add an identity or edit one in place
      description: >
        Keyed by address within the account; editing the primary identity is the
        same call as adding an alias. The address must be a bare ASCII addr-spec.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityInput"
      responses:
        "200":
          description: The stored identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "400":
          description: The address, name or signature is not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The account already has the maximum number of identities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /accounts/{id}/identities/{identityId}:
    delete:
      operationId: deleteIdentity
      summary: Remove a stored identity
      description: The account's own address is always primary and cannot be removed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: identityId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The account's primary address cannot be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /accounts/{id}/uploads:
    post:
      operationId: uploadAttachment
      summary: Stage an outgoing attachment
      description: >
        The raw request body is streamed to disk and never read whole into
        memory. The declared type is checked against the dangerous-type deny list
        and the bytes are sniffed; a file over 25 MiB is 413 `too_large`. `name`
        is the original file name, percent-encoded in the query.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The staged upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          description: >
            `bad_request` (missing name), `bad_type` (a dangerous attachment
            type) or `invalid_message` (a header-hostile name).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: The file is over the 25 MiB cap (`too_large`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /accounts/{id}/uploads/{uploadId}:
    get:
      operationId: getUpload
      summary: Stream a staged attachment's bytes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The staged bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteUpload
      summary: Free a staged attachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Freed
        "404":
          $ref: "#/components/responses/NotFound"
  /accounts/{id}/uploads/from-mail:
    post:
      operationId: uploadFromMail
      summary: Attach a mirrored attachment with no browser upload
      description: >
        Streams the part from the account's mirror into staging server-side, so
        nothing is uploaded from the browser.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadFromMailInput"
      responses:
        "201":
          description: The staged copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The part is no longer available (`message_gone`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /accounts/{id}/mail-attachments:
    get:
      operationId: listMailAttachments
      summary: Recent attachments already in the mirror
      description: The "From your mail" list; newest first, bounded.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: The attachments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailAttachmentList"
        "404":
          $ref: "#/components/responses/NotFound"
  /inbox:
    get:
      operationId: listInbox
      summary: Inbox summaries, newest first
      description: >
        `folder` picks the folder view by role and defaults to the inbox; the
        Trash view is where the reader's Empty Trash control lives. An unknown
        role is a 400, never an empty page.
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
        - name: folder
          in: query
          description: >
            A folder role, or `snoozed` for the local hidden-until list. Snoozed
            and Reading mail is hidden from every other view.
          schema:
            type: string
            enum: [inbox, archive, trash, junk, snoozed]
        - name: tag
          in: query
          description: Show only mail carrying this tag id
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of the inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inbox"
  /messages/{id}:
    get:
      operationId: getMessage
      summary: One message with its sanitized body
      parameters:
        - $ref: "#/components/parameters/MessageID"
      responses:
        "200":
          description: The message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailMessage"
        "404":
          $ref: "#/components/responses/NotFound"
  /messages/{id}/summary:
    get:
      operationId: getMessageSummary
      summary: The header alone, for a failed body
      parameters:
        - $ref: "#/components/parameters/MessageID"
      responses:
        "200":
          description: The summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailSummary"
        "404":
          $ref: "#/components/responses/NotFound"
  /messages/{id}/reply:
    get:
      operationId: replyToMessage
      summary: A reply prefill for a message
      description: >
        The recipients, subject, threading headers and body a reply or reply-all
        starts from, plus the identity to send as. `all=true` adds the original
        To and Cc minus the operator's own addresses.
      parameters:
        - $ref: "#/components/parameters/MessageID"
        - name: all
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The prefill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposePrefill"
        "404":
          $ref: "#/components/responses/NotFound"
  /messages/{id}/forward:
    get:
      operationId: forwardMessage
      summary: A forward prefill for a message
      parameters:
        - $ref: "#/components/parameters/MessageID"
      responses:
        "200":
          description: The prefill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposePrefill"
        "404":
          $ref: "#/components/responses/NotFound"
  /messages/{id}/snooze:
    post:
      operationId: snoozeMessage
      summary: Hide a message locally until a preset time
      description: >
        A local hide-until: the mail stays on the server and in the mirror, and
        comes back on its own. Nothing is written to IMAP.
      parameters:
        - $ref: "#/components/parameters/MessageID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnoozeRequest"
      responses:
        "204":
          description: Snoozed
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unsnoozeMessage
      summary: Wake a snoozed message now
      parameters:
        - $ref: "#/components/parameters/MessageID"
      responses:
        "204":
          description: Woken
        "404":
          $ref: "#/components/responses/NotFound"
  /reading:
    get:
      operationId: listReading
      summary: The Reading feed and its digest
      parameters:
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page
          schema:
            type: string
      responses:
        "200":
          description: The feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingFeed"
  /search:
    get:
      operationId: search
      summary: Hybrid keyword plus meaning search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: account_id
          in: query
          description: Restrict to one account; repeatable for the combined view.
          schema:
            type: array
            items:
              type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Ranked hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
  /ask:
    post:
      operationId: ask
      summary: Ask Ivy a question about the selected accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: A cited answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskAnswer"
        "429":
          description: The monthly cap is reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The provider is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tags:
    get:
      operationId: listTags
      summary: User tags and placed tags
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagsOverview"
    post:
      operationId: createTag
      summary: Create a tag
      description: >
        The tag's slug (its IMAP keyword `$ivy-<slug>`) is fixed here; a name that
        slugs like an existing one gets a numeric suffix.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagCreate"
      responses:
        "201":
          description: The new tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTag"
        "400":
          description: The name is empty or too long, or the colour is not one of the palette
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: There are already too many tags (`too_many_tags`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tags/{id}:
    patch:
      operationId: updateTag
      summary: Rename or recolour a tag
      description: The slug never changes, so the keyword already on the server keeps its meaning.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagUpdate"
      responses:
        "200":
          description: The updated tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTag"
        "400":
          description: The name or colour is not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTag
      summary: Delete a tag and clear its keyword from the server
      description: >
        Queues one outbox flags op per message copy that carries the keyword, then
        removes the tag and its memberships. If those ops would not fit in the outbox
        nothing is deleted (`outbox_full`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: No such tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Too many keywords to clear at once (`outbox_full`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /people:
    get:
      operationId: listPeople
      summary: Correspondents derived from the mirror, most correspondence first
      parameters:
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page
          schema:
            type: string
      responses:
        "200":
          description: One page of people (100 at a time)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeoplePage"
  /people/{id}:
    get:
      operationId: getPerson
      summary: One correspondent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          $ref: "#/components/responses/NotFound"
  /people/{id}/addresses:
    post:
      operationId: linkPersonAddress
      summary: Merge another address into this person
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonAddress"
      responses:
        "204":
          description: Merged
        "400":
          description: The address is empty or is the person itself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /people/{id}/addresses/{address}:
    delete:
      operationId: unlinkPersonAddress
      summary: Split an address out of this person
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Split
        "404":
          $ref: "#/components/responses/NotFound"
  /rules:
    get:
      operationId: listRules
      summary: Rules as plain sentences
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
    post:
      operationId: createRule
      summary: Create a rule
      description: >
        Conditions and actions are validated against a closed vocabulary (from,
        subject, account, has_attachment; tag, reading, snooze). Nothing runs
        until the rule is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "201":
          description: The new rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          description: A condition or action is outside the vocabulary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: There are already too many rules (`too_many_rules`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rules/dry-run:
    post:
      operationId: dryRunRule
      summary: Count what a condition set would match
      description: >
        A free local preview over the most recent messages. It writes nothing,
        not even a rule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleDryRunRequest"
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleDryRunResult"
        "400":
          description: A condition is outside the vocabulary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rules/{id}:
    get:
      operationId: getRule
      summary: One rule
      parameters:
        - $ref: "#/components/parameters/RuleID"
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateRule
      summary: Replace a rule's conditions, actions and scope
      parameters:
        - $ref: "#/components/parameters/RuleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "200":
          description: The updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          description: A condition or action is outside the vocabulary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: setRuleEnabled
      summary: Turn a rule on or off
      parameters:
        - $ref: "#/components/parameters/RuleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleToggle"
      responses:
        "200":
          description: The updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRule
      summary: Delete a rule and its match history
      parameters:
        - $ref: "#/components/parameters/RuleID"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /rules/{id}/apply:
    post:
      operationId: applyRule
      summary: Apply a rule to the mail already mirrored
      description: >
        The deliberate way for a new rule to reach old mail; the ingest pass only
        ever sees messages it has not evaluated. Idempotent.
      parameters:
        - $ref: "#/components/parameters/RuleID"
      responses:
        "200":
          description: How many messages matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleApplyResult"
        "404":
          $ref: "#/components/responses/NotFound"
  /checks:
    get:
      operationId: listChecks
      summary: Smart checks
      responses:
        "200":
          description: Checks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Check"
  /checks/{id}:
    get:
      operationId: getCheck
      summary: One smart check
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /mirror/health:
    get:
      operationId: getMirrorHealth
      summary: Per-account sync state and index health
      responses:
        "200":
          description: Health overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOverview"
  /mirror/messages/{id}/restore:
    post:
      operationId: restoreMessage
      summary: Make one hidden message visible again
      description: >
        A local mirror change, never an IMAP write. It only clears the disabled
        flag; a message the server still does not hold is hidden again by the
        next completed pass.
      parameters:
        - $ref: "#/components/parameters/MessageID"
      responses:
        "204":
          description: Restored, or already visible
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The message is pending classification (code pending_classification):
            a pass hid it but has not yet decided whether it moved or was
            removed. It stays hidden until the next completed pass settles it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /mirror/accounts/{id}/restore:
    post:
      operationId: restoreAccountHidden
      summary: Make an account's removed mail visible again
      description: >
        The one-click answer to a mass-disable alert. It restores mail the server
        dropped. Rows that moved to another folder stay hidden (their mail is
        live there, so restoring them would show it twice), and rows a pass has
        not classified yet are left for the next completed pass to settle.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: How many rows were restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"
  /mirror/messages/{id}:
    delete:
      operationId: purgeMessage
      summary: Permanently erase one hidden message
      description: >
        The only erasure Ivy has. It deletes the row and its attachments,
        unlinks the spool file, and erases the message's blob from the local
        store and every backup target when no other hidden message shares those
        bytes. An offline backup target keeps the deletion pending and the daily
        backup retries it. A live message is refused, so the reader's ordinary
        delete can never reach it.
      parameters:
        - $ref: "#/components/parameters/MessageID"
      responses:
        "204":
          description: Erased
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The message is not hidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /events:
    get:
      operationId: streamEvents
      summary: Server-sent hints that something changed
      description: >
        A stream of small typed hints that say what to refetch (round 37). Each
        frame is `event: <type>` and one `data:` line holding an Event as JSON.
        There are no event ids and no replay: after any reconnect, refetch what
        you are showing. A slow client's queue is bounded and drops its oldest
        hints. Comment lines (`: keepalive`) are heartbeats, and the first frame
        is `retry: 3000`. At most 16 streams are open at once.
      responses:
        "200":
          description: An open event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Event"
        "503":
          description: Too many streams are open (`too_many_streams`) or Ivy is shutting down (`unavailable`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /send:
    post:
      operationId: sendMessage
      summary: Queue an outgoing message
      description: >
        The Send button is the explicit confirmation. The message is built and
        committed to the send queue before this answers; the worker submits it
        after the undo window (`compose.undo_delay_seconds`, 0 = no window). A
        client-supplied `id` makes a retried request idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRequest"
      responses:
        "202":
          description: The message is queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendStatus"
        "400":
          description: >
            `bad_request` (malformed), `bad_from` (the From is not one of this
            account's sending addresses), `invalid_message` (the
            builder refused a field; `detail` names it), or an over-large body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The account's send queue is full (`send_full`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listSends
      summary: Live and recent outgoing messages
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Live sends and recent terminal ones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendList"
  /send/{id}:
    get:
      operationId: getSend
      summary: One outgoing message
      parameters:
        - $ref: "#/components/parameters/SendID"
      responses:
        "200":
          description: The send
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendStatus"
        "404":
          $ref: "#/components/responses/NotFound"
  /send/{id}/undo:
    post:
      operationId: undoSend
      summary: Undo a queued send before its deadline
      description: >
        Cancels a queued message and returns its draft so the compose screen can
        restore it. The deadline is server-side, so a closed tab or a restart
        does not move it. At or after the deadline, or once the message has left
        the queue, the answer is 409 `too_late`; there is no undo.
      parameters:
        - $ref: "#/components/parameters/SendID"
      responses:
        "200":
          description: The send is cancelled; `draft` holds the original request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendStatus"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The send can no longer be undone (`too_late`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /drafts:
    get:
      operationId: listDrafts
      summary: Compose drafts
      description: >
        The local drafts Ivy tracks merged with the account's mirrored Drafts
        folder, so a draft made in Apple Mail appears too. Newest first.
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: The drafts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftList"
    post:
      operationId: saveDraft
      summary: Save a compose draft version
      description: >
        Files a new immutable version into the server's Drafts folder and removes
        the version it supersedes, through the outbox. `draftId` plus
        `baseVersion` give optimistic concurrency: a stale save is 409
        `draft_conflict` carrying the newer content. A client-supplied `id` makes
        a retried save idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftRequest"
      responses:
        "200":
          description: The stored version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftSummary"
        "400":
          description: >
            `bad_request` (malformed), `bad_from` (the From is not this
            account's address) or `invalid_message` (the builder refused a
            field; `detail` names it).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            A stale save (`draft_conflict`; the body is the newer DraftResume) or
            a full outbox (`outbox_full`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftResume"
  /drafts/{id}:
    get:
      operationId: getDraft
      summary: Resume a draft
      parameters:
        - $ref: "#/components/parameters/DraftID"
        - name: account_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The compose fields to resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftResume"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: discardDraft
      summary: Discard a draft and remove its server copy
      parameters:
        - $ref: "#/components/parameters/DraftID"
        - name: account_id
          in: query
          schema:
            type: string
      responses:
        "204":
          description: The draft is gone
        "404":
          $ref: "#/components/responses/NotFound"
  /outbox:
    post:
      operationId: enqueueOutbox
      summary: Apply a reader action through the outbox
      description: >
        The one write path to IMAP. The op row is committed before the action is
        reported accepted; the IMAP command follows, and the mirror follows that.
        A move or delete needs an explicit confirmation from the UI before this
        call; an undo is the inverse action, enqueued the same way. A repeat of a
        live action returns the existing op instead of queueing a second one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboxAction"
      responses:
        "202":
          description: The action is queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The action cannot be queued: `no_archive_folder` / `no_trash_folder`
            / `no_junk_folder` when the account has no folder for the role,
            `outbox_full` when the queue cap is reached, or `not_trash` when an
            expunge names a folder that is not the trash, or `not_synced` when
            the message was named by the row a finished move hid (an Undo) and
            sync has not yet mirrored it in its new folder. `messageId` of a
            hidden-by-move row is followed to the copy in the folder that move
            delivered it to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listOutbox
      summary: Live and recent outbox ops
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Live ops (the overlay) and recent terminal ones (history)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxList"
  /outbox/batch:
    post:
      operationId: enqueueOutboxBatch
      summary: Apply one reader action to several messages at once
      description: >
        The same write path as POST /outbox, one op per message, committed in a
        single transaction: when the queue has no room for all of them none is
        queued (`outbox_full`), so a selection never half-enqueues. A message
        that cannot take the action (gone, already in that folder, no folder for
        the role) is returned in `skipped` with its reason, and the rest are
        queued. At most 200 messages; more is `batch_too_large`. `expunge` is not
        a batch action. The UI confirms a move or delete, once, with the count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboxBatch"
      responses:
        "202":
          description: The ops are queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxBatchResult"
        "400":
          description: Not valid, or more than 200 messages (`batch_too_large`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The queue cannot hold the whole batch (`outbox_full`); nothing was queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /outbox/{id}:
    delete:
      operationId: dismissOutbox
      summary: Dismiss a terminal op
      description: >
        Removes a terminal row from the history. A live op is refused; it is
        never silently dropped.
      parameters:
        - $ref: "#/components/parameters/OutboxID"
      responses:
        "204":
          description: Dismissed
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The op is still live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /outbox/{id}/retry:
    post:
      operationId: retryOutbox
      summary: Retry a failed op now
      description: >
        Returns a failed op to the queue immediately, clearing its attempt count
        so the retry cap is measured afresh.
      parameters:
        - $ref: "#/components/parameters/OutboxID"
      responses:
        "200":
          description: The op is queued again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The op is not failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /update:
    get:
      operationId: getUpdateStatus
      summary: The state of the last self-update attempt
      description: >
        Reports whether a pull is running and, once the host watcher has
        finished, how it went. `unavailable` is true when this deployment has no
        host-side update watcher, so the UI can say so instead of offering a
        button that can never work.
      responses:
        "200":
          description: The current update state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
    post:
      operationId: requestUpdate
      summary: Ask the host watcher to pull and deploy the latest image
      description: >
        Resolves the latest published image digest from GHCR (waiting out an
        in-progress CI build) and writes the host watcher's signal file. Returns
        as soon as the request is accepted; the pull, recreate, health check and
        rollback happen on the host, and the outcome is read from `GET /update`.
        Only one update may run at a time.
      responses:
        "202":
          description: The update is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
        "409":
          description: An update is already running (`update_running`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: This deployment has no update path (`update_unavailable`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    MessageID:
      name: id
      in: path
      required: true
      schema:
        type: string
    OutboxID:
      name: id
      in: path
      required: true
      schema:
        type: string
    SendID:
      name: id
      in: path
      required: true
      schema:
        type: string
    DraftID:
      name: id
      in: path
      required: true
      schema:
        type: string
    RuleID:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: No such resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable code the UI maps to its own copy
        message:
          type: string
        detail:
          type: string
    Event:
      type: object
      description: One hint on the event stream. It says what changed, never the new value.
      required: [type]
      properties:
        type:
          type: string
          enum: [message.changed, folder.changed, sync.state, outbox.state, health.alert, update.state, send.state]
          # Without explicit names the Go constant for sync.state is `SyncState`,
          # which collides with the SyncState type.
          x-enum-varnames:
            [EventTypeMessageChanged, EventTypeFolderChanged, EventTypeSyncState, EventTypeOutboxState, EventTypeHealthAlert, EventTypeUpdateState, EventTypeSendState]
        accountId:
          type: string
        folder:
          type: string
        code:
          type: string
          description: Stable reason, used by health.alert
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
    UpdateWatcherResult:
      type: object
      description: The host watcher's own account of its last attempt.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, failed, skipped]
        detail:
          type: string
        target:
          type: string
        finished_at:
          type: string
    UpdateStatus:
      type: object
      required: [unavailable, running, done, success]
      properties:
        unavailable:
          type: boolean
        running:
          type: boolean
        done:
          type: boolean
        success:
          type: boolean
        target:
          type: string
        error:
          type: string
        watcher:
          $ref: "#/components/schemas/UpdateWatcherResult"
    Liveness:
      type: object
      required: [status, version, databases]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        version:
          type: string
        databases:
          type: object
          additionalProperties:
            type: string
    TagColor:
      type: string
      enum: [sky, rose, teal, coral, lilac, mint, gold, sand, orchid, fern, slate, berry]
    SnoozeRequest:
      type: object
      required: [preset]
      properties:
        preset:
          type: string
          enum: [later_today, tomorrow, weekend, next_week]
    AccountSlot:
      type: integer
      enum: [1, 2, 3, 4, 5]
    SyncState:
      type: string
      enum: [ok, syncing, auth-failed, unreachable]
    Account:
      type: object
      required: [id, address, short, initial, slot, unread, smart, sync, syncNote, name, icon, photo]
      properties:
        id:
          type: string
        address:
          type: string
        short:
          type: string
        initial:
          type: string
        name:
          type: string
          description: The account's display name, empty when it has none
        icon:
          type: string
          description: A Lucide icon name from the closed list the server accepts (store.AccountIcons), empty when it has none. A name the client does not know is drawn as the initial.
        photo:
          type: boolean
          description: Whether GET /accounts/{id}/photo serves a photo
        slot:
          $ref: "#/components/schemas/AccountSlot"
        unread:
          type: integer
        smart:
          type: boolean
        sync:
          $ref: "#/components/schemas/SyncState"
        syncNote:
          type: string
          description: >
            What the sync is doing, as a short phrase with no time in it ("Up to
            date", "Reading your mailbox, newest first"). The browser appends
            "synced 4 min ago" from syncedAt.
        syncedAt:
          type: string
          format: date-time
          description: >
            When the account's mailbox last synced, RFC 3339 in UTC. Absent until
            the first folder has synced.
        progress:
          type: number
          minimum: 0
          maximum: 1
        hidden:
          $ref: "#/components/schemas/HiddenMail"
    AccountProfile:
      type: object
      description: A partial rename; omitted fields keep their current value
      properties:
        displayName:
          type: string
          maxLength: 120
        icon:
          type: string
          maxLength: 16
          description: A Lucide icon name from the closed list, or empty to clear it. Anything else is a 400.
        smart:
          type: boolean
          description: >
            Turn smart features on or off for the account. It is stored in state.db and read
            live by the gate, so turning it off stops remote calls at once. An account declared
            in ivy.yaml is changed there, not here (409 `configured_in_yaml`).
    Identity:
      type: object
      required: [id, accountId, address, name, signature, primary]
      properties:
        id:
          type: string
          description: The row id; empty for the synthetic primary before it is first edited
        accountId:
          type: string
        address:
          type: string
        name:
          type: string
          description: The display name the recipient sees, RFC 2047 encoded by the builder
        signature:
          type: string
          description: Plain text appended behind the -- separator when composing
        primary:
          type: boolean
          description: The account's own address; never deletable
    IdentityInput:
      type: object
      required: [address]
      properties:
        address:
          type: string
          maxLength: 320
        name:
          type: string
          maxLength: 120
        signature:
          type: string
          maxLength: 8192
    IdentityList:
      type: object
      required: [identities]
      properties:
        identities:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
    ConnectAccount:
      type: object
      required: [address, password]
      properties:
        address:
          type: string
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
          description: An app password if the provider offers one. Never stored in a database and never returned.
        smart:
          type: boolean
          description: Smart features (hosted embeddings for search). Off unless asked for.
    ConnectedAccount:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: The account id to use with the other account endpoints
    UpdatePassword:
      type: object
      required: [password]
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
    Attachment:
      type: object
      required: [id, name, size, kind]
      properties:
        id:
          type: string
        name:
          type: string
        size:
          type: string
        kind:
          type: string
          enum: [image, file]
        tone:
          type: string
          enum: [a, b]
        failed:
          type: boolean
    MailSummary:
      type: object
      required: [id, accountId, from, initials, date, subject, preview, unread, needs]
      properties:
        id:
          type: string
        accountId:
          type: string
        from:
          type: string
        initials:
          type: string
        date:
          type: string
          format: date-time
          description: >
            The message's instant, RFC 3339 in UTC. The browser formats it in the
            viewer's own zone and locale; a message with no Date header carries the
            zero instant (0001-01-01T00:00:00Z) and shows no time.
        subject:
          type: string
        preview:
          type: string
        unread:
          type: boolean
        flagged:
          type: boolean
          description: Whether the message carries the \\Flagged keyword
        needs:
          type: boolean
        tag:
          type: string
    MailMessage:
      type: object
      required:
        [id, accountId, from, initials, date, subject, preview, unread, needs,
         toShort, toFull, sender, to, cc, auth, paragraphs, attachments]
      properties:
        sender:
          $ref: "#/components/schemas/MessageParty"
        to:
          type: array
          items:
            $ref: "#/components/schemas/MessageParty"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/MessageParty"
        auth:
          $ref: "#/components/schemas/MessageAuth"
        id:
          type: string
        accountId:
          type: string
        from:
          type: string
        initials:
          type: string
        date:
          type: string
          format: date-time
          description: The message's instant, RFC 3339 in UTC (see MailSummary).
        subject:
          type: string
        preview:
          type: string
        unread:
          type: boolean
        flagged:
          type: boolean
          description: Whether the message carries the \\Flagged keyword
        needs:
          type: boolean
        tag:
          type: string
        tagIds:
          type: array
          description: Every tag the message is in, for the tag picker; `tag` is the first by name
          items:
            type: string
        toShort:
          type: string
        toFull:
          type: string
        summary:
          type: string
        html:
          type: string
          description: >-
            Server-sanitised HTML body, safe to place in the reader's sandboxed
            frame. Empty for a message with no HTML part; use paragraphs then.
        paragraphs:
          type: array
          items:
            type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
    MessageParty:
      type: object
      description: >
        Someone on a message, exactly as the sender wrote it. The name is
        sender-controlled text and must be shown as plain text next to the real
        address, since a name that contains another address is the classic spoof.
      required: [name, address]
      properties:
        name:
          type: string
          description: The display name with any wrapping quotes removed; empty when there is none
        address:
          type: string
          description: The address, lower-cased
        personId:
          type: string
          description: >
            The People page for this address, after the operator's merges. Absent
