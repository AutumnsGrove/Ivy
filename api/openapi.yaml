openapi: 3.1.0
info:
  title: Ivy API
  version: 0.0.1
  description: >
    The typed contract shared by the Go server and the SvelteKit client
    (STANDARDS.md section 6). Go and TypeScript code are generated from this
    file; committed outputs are drift-checked in CI. Only the read surface the
    frontend already calls is described so far; mutations and SSE event bodies
    are added per milestone. SSE event shapes are an extension because OpenAPI
    does not model them natively.
servers:
  - url: /api/v1
paths:
  /version:
    get:
      operationId: getVersion
      summary: The running build version
      responses:
        "200":
          description: Build info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /health:
    get:
      operationId: getLiveness
      summary: Process and database liveness
      responses:
        "200":
          description: All databases reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
        "503":
          description: One or more databases unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /accounts:
    get:
      operationId: listAccounts
      summary: Configured accounts
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
  /accounts/{id}:
    patch:
      operationId: updateAccountProfile
      summary: Rename an account or choose its icon
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountProfile"
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/NotFound"
  /inbox:
    get:
      operationId: listInbox
      summary: Inbox summaries, newest first
      description: >
        `folder` picks the folder view by role and defaults to the inbox; the
        Trash view is where the reader's Empty Trash control lives. An unknown
        role is a 400, never an empty page.
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
        - name: folder
          in: query
          schema:
            type: string
            enum: [inbox, archive, trash, junk]
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of the inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inbox"
  /messages/{id}:
    get:
      operationId: getMessage
      summary: One message with its sanitized body
      parameters:
        - $ref: "#/components/parameters/MessageID"
      responses:
        "200":
          description: The message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailMessage"
        "404":
          $ref: "#/components/responses/NotFound"
  /messages/{id}/summary:
    get:
      operationId: getMessageSummary
      summary: The header alone, for a failed body
      parameters:
        - $ref: "#/components/parameters/MessageID"
      responses:
        "200":
          description: The summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailSummary"
        "404":
          $ref: "#/components/responses/NotFound"
  /reading:
    get:
      operationId: listReading
      summary: The Reading feed and its digest
      responses:
        "200":
          description: The feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingFeed"
  /search:
    get:
      operationId: search
      summary: Hybrid keyword plus meaning search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Ranked hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
  /ask:
    post:
      operationId: ask
      summary: Ask Ivy a question about the selected accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: A cited answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskAnswer"
        "429":
          description: The monthly cap is reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The provider is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tags:
    get:
      operationId: listTags
      summary: User tags and placed tags
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagsOverview"
    post:
      operationId: createTag
      summary: Create a tag
      description: >
        The tag's slug (its IMAP keyword `$ivy-<slug>`) is fixed here; a name that
        slugs like an existing one gets a numeric suffix.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagCreate"
      responses:
        "201":
          description: The new tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTag"
        "400":
          description: The name is empty or too long, or the colour is not one of the palette
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: There are already too many tags (`too_many_tags`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tags/{id}:
    patch:
      operationId: updateTag
      summary: Rename or recolour a tag
      description: The slug never changes, so the keyword already on the server keeps its meaning.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagUpdate"
      responses:
        "200":
          description: The updated tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTag"
        "400":
          description: The name or colour is not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTag
      summary: Delete a tag and clear its keyword from the server
      description: >
        Queues one outbox flags op per message copy that carries the keyword, then
        removes the tag and its memberships. If those ops would not fit in the outbox
        nothing is deleted (`outbox_full`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: No such tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Too many keywords to clear at once (`outbox_full`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /people:
    get:
      operationId: listPeople
      summary: Correspondents derived from the mirror
      responses:
        "200":
          description: People
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
  /people/{id}:
    get:
      operationId: getPerson
      summary: One correspondent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          $ref: "#/components/responses/NotFound"
  /rules:
    get:
      operationId: listRules
      summary: Rules as plain sentences
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
  /rules/{id}:
    get:
      operationId: getRule
      summary: One rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "404":
          $ref: "#/components/responses/NotFound"
  /checks:
    get:
      operationId: listChecks
      summary: Smart checks
      responses:
        "200":
          description: Checks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Check"
  /checks/{id}:
    get:
      operationId: getCheck
      summary: One smart check
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /mirror/health:
    get:
      operationId: getMirrorHealth
      summary: Per-account sync state and index health
      responses:
        "200":
          description: Health overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOverview"
  /mirror/messages/{id}/restore:
    post:
      operationId: restoreMessage
      summary: Make one hidden message visible again
      description: >
        A local mirror change, never an IMAP write. It only clears the disabled
        flag; a message the server still does not hold is hidden again by the
        next completed pass.
      parameters:
        - $ref: "#/components/parameters/MessageID"
      responses:
        "204":
          description: Restored, or already visible
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The message is pending classification (code pending_classification):
            a pass hid it but has not yet decided whether it moved or was
            removed. It stays hidden until the next completed pass settles it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /mirror/accounts/{id}/restore:
    post:
      operationId: restoreAccountHidden
      summary: Make an account's removed mail visible again
      description: >
        The one-click answer to a mass-disable alert. It restores mail the server
        dropped. Rows that moved to another folder stay hidden (their mail is
        live there, so restoring them would show it twice), and rows a pass has
        not classified yet are left for the next completed pass to settle.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: How many rows were restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"
  /mirror/messages/{id}:
    delete:
      operationId: purgeMessage
      summary: Permanently erase one hidden message
      description: >
        The only erasure Ivy has. It deletes the row and its attachments,
        unlinks the spool file, and erases the message's blob from the local
        store and every backup target when no other hidden message shares those
        bytes. An offline backup target keeps the deletion pending and the daily
        backup retries it. A live message is refused, so the reader's ordinary
        delete can never reach it.
      parameters:
        - $ref: "#/components/parameters/MessageID"
      responses:
        "204":
          description: Erased
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The message is not hidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /events:
    get:
      operationId: streamEvents
      summary: Server-sent hints that something changed
      description: >
        A stream of small typed hints that say what to refetch (round 37). Each
        frame is `event: <type>` and one `data:` line holding an Event as JSON.
        There are no event ids and no replay: after any reconnect, refetch what
        you are showing. A slow client's queue is bounded and drops its oldest
        hints. Comment lines (`: keepalive`) are heartbeats, and the first frame
        is `retry: 3000`. At most 16 streams are open at once.
      responses:
        "200":
          description: An open event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Event"
        "503":
          description: Too many streams are open (`too_many_streams`) or Ivy is shutting down (`unavailable`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /outbox:
    post:
      operationId: enqueueOutbox
      summary: Apply a reader action through the outbox
      description: >
        The one write path to IMAP. The op row is committed before the action is
        reported accepted; the IMAP command follows, and the mirror follows that.
        A move or delete needs an explicit confirmation from the UI before this
        call; an undo is the inverse action, enqueued the same way. A repeat of a
        live action returns the existing op instead of queueing a second one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboxAction"
      responses:
        "202":
          description: The action is queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The action cannot be queued: `no_archive_folder` / `no_trash_folder`
            / `no_junk_folder` when the account has no folder for the role,
            `outbox_full` when the queue cap is reached, or `not_trash` when an
            expunge names a folder that is not the trash, or `not_synced` when
            the message was named by the row a finished move hid (an Undo) and
            sync has not yet mirrored it in its new folder. `messageId` of a
            hidden-by-move row is followed to the copy in the folder that move
            delivered it to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listOutbox
      summary: Live and recent outbox ops
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Live ops (the overlay) and recent terminal ones (history)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxList"
  /outbox/{id}:
    delete:
      operationId: dismissOutbox
      summary: Dismiss a terminal op
      description: >
        Removes a terminal row from the history. A live op is refused; it is
        never silently dropped.
      parameters:
        - $ref: "#/components/parameters/OutboxID"
      responses:
        "204":
          description: Dismissed
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The op is still live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /outbox/{id}/retry:
    post:
      operationId: retryOutbox
      summary: Retry a failed op now
      description: >
        Returns a failed op to the queue immediately, clearing its attempt count
        so the retry cap is measured afresh.
      parameters:
        - $ref: "#/components/parameters/OutboxID"
      responses:
        "200":
          description: The op is queued again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The op is not failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    MessageID:
      name: id
      in: path
      required: true
      schema:
        type: string
    OutboxID:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: No such resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable code the UI maps to its own copy
        message:
          type: string
        detail:
          type: string
    Event:
      type: object
      description: One hint on the event stream. It says what changed, never the new value.
      required: [type]
      properties:
        type:
          type: string
          enum: [message.changed, folder.changed, sync.state, outbox.state, health.alert]
          # Without explicit names the Go constant for sync.state is `SyncState`,
          # which collides with the SyncState type.
          x-enum-varnames:
            [EventTypeMessageChanged, EventTypeFolderChanged, EventTypeSyncState, EventTypeOutboxState, EventTypeHealthAlert]
        accountId:
          type: string
        folder:
          type: string
        code:
          type: string
          description: Stable reason, used by health.alert
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
    Liveness:
      type: object
      required: [status, version, databases]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        version:
          type: string
        databases:
          type: object
          additionalProperties:
            type: string
    TagColor:
      type: string
      enum: [sky, rose, teal, coral, lilac, mint, gold, sand, orchid, fern, slate, berry]
    AccountSlot:
      type: integer
      enum: [1, 2, 3, 4, 5]
    SyncState:
      type: string
      enum: [ok, syncing, auth-failed, unreachable]
    Account:
      type: object
      required: [id, address, short, initial, slot, unread, smart, sync, syncNote, name, icon, photo]
      properties:
        id:
          type: string
        address:
          type: string
        short:
          type: string
        initial:
          type: string
        name:
          type: string
          description: The account's display name, empty when it has none
        icon:
          type: string
          description: A chosen emoji or glyph, empty when it has none
        photo:
          type: boolean
          description: Whether GET /accounts/{id}/photo serves a photo
        slot:
          $ref: "#/components/schemas/AccountSlot"
        unread:
          type: integer
        smart:
          type: boolean
        sync:
          $ref: "#/components/schemas/SyncState"
        syncNote:
          type: string
          description: >
            What the sync is doing, as a short phrase with no time in it ("Up to
            date", "Reading your mailbox, newest first"). The browser appends
            "synced 4 min ago" from syncedAt.
        syncedAt:
          type: string
          format: date-time
          description: >
            When the account's mailbox last synced, RFC 3339 in UTC. Absent until
            the first folder has synced.
        progress:
          type: number
          minimum: 0
          maximum: 1
        hidden:
          $ref: "#/components/schemas/HiddenMail"
    AccountProfile:
      type: object
      description: A partial rename; omitted fields keep their current value
      properties:
        displayName:
          type: string
          maxLength: 120
        icon:
          type: string
          maxLength: 16
    Attachment:
      type: object
      required: [id, name, size, kind]
      properties:
        id:
          type: string
        name:
          type: string
        size:
          type: string
        kind:
          type: string
          enum: [image, file]
        tone:
          type: string
          enum: [a, b]
        failed:
          type: boolean
    MailSummary:
      type: object
      required: [id, accountId, from, initials, date, subject, preview, unread, needs]
      properties:
        id:
          type: string
        accountId:
          type: string
        from:
          type: string
        initials:
          type: string
        date:
          type: string
          format: date-time
          description: >
            The message's instant, RFC 3339 in UTC. The browser formats it in the
            viewer's own zone and locale; a message with no Date header carries the
            zero instant (0001-01-01T00:00:00Z) and shows no time.
        subject:
          type: string
        preview:
          type: string
        unread:
          type: boolean
        flagged:
          type: boolean
          description: Whether the message carries the \\Flagged keyword
        needs:
          type: boolean
        tag:
          type: string
    MailMessage:
      type: object
      required:
        [id, accountId, from, initials, date, subject, preview, unread, needs,
         toShort, toFull, paragraphs, attachments]
      properties:
        id:
          type: string
        accountId:
          type: string
        from:
          type: string
        initials:
          type: string
        date:
          type: string
          format: date-time
          description: The message's instant, RFC 3339 in UTC (see MailSummary).
        subject:
          type: string
        preview:
          type: string
        unread:
          type: boolean
        flagged:
          type: boolean
          description: Whether the message carries the \\Flagged keyword
        needs:
          type: boolean
        tag:
          type: string
        tagIds:
          type: array
          description: Every tag the message is in, for the tag picker; `tag` is the first by name
          items:
            type: string
        toShort:
          type: string
        toFull:
          type: string
        summary:
          type: string
        html:
          type: string
          description: >-
            Server-sanitised HTML body, safe to place in the reader's sandboxed
            frame. Empty for a message with no HTML part; use paragraphs then.
        paragraphs:
          type: array
          items:
            type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
    Inbox:
      type: object
      required: [items, needCount, unreadCount, readingWaiting]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MailSummary"
        needCount:
          type: integer
        unreadCount:
          type: integer
        readingWaiting:
          type: integer
        nextCursor:
          type: string
    Issue:
      type: object
      required: [id, sender, initials, read, title]
      properties:
        id:
          type: string
        sender:
          type: string
        initials:
          type: string
        minutes:
          type: integer
        read:
          type: boolean
        title:
          type: string
        blurb:
          type: string
    ReadingFeed:
      type: object
      required: [digest, issues]
      properties:
        digest:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
    SearchHit:
      type: object
      required: [id, accountId, from, date, subject, preview]
      properties:
        id:
          type: string
        accountId:
          type: string
        from:
          type: string
        date:
          type: string
          format: date-time
          description: The message's instant, RFC 3339 in UTC (see MailSummary).
        subject:
          type: string
        preview:
          type: string
        hasAttachment:
          type: boolean
        tag:
          type: string
        semantic:
          type: boolean
    SearchResults:
      type: object
      required: [query, total, hits]
      properties:
        query:
          type: string
        total:
          type: integer
        hits:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        nextCursor:
          type: string
    AskRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
        accountIds:
          type: array
          items:
            type: string
    AskStep:
      type: object
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [search, read, think]
        text:
          type: string
    AskSource:
      type: object
      required: [n, subject, meta]
      properties:
        n:
          type: integer
        subject:
          type: string
        meta:
          type: string
    AskAnswer:
      type: object
      required: [question, steps, answer, sources]
      properties:
        question:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/AskStep"
        answer:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/AskSource"
    UserTag:
      type: object
      required: [id, slug, name, color, count]
      properties:
        id:
          type: string
        slug:
          type: string
          description: The ASCII slug fixed at creation; the tag's IMAP keyword is `$ivy-<slug>`
        name:
          type: string
        color:
          $ref: "#/components/schemas/TagColor"
        count:
          type: integer
    TagCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: At most 64 characters
        color:
          $ref: "#/components/schemas/TagColor"
    TagUpdate:
      type: object
      properties:
        name:
          type: string
        color:
          $ref: "#/components/schemas/TagColor"
    PlacedTag:
      type: object
      required: [id, name, count]
      properties:
        id:
          type: string
        name:
          type: string
        count:
          type: integer
    TagsOverview:
      type: object
      required: [mine, placed, activeRules]
      properties:
        mine:
          type: array
          items:
            $ref: "#/components/schemas/UserTag"
        placed:
          type: array
          items:
            $ref: "#/components/schemas/PlacedTag"
        activeRules:
          type: integer
    Conversation:
      type: object
      required: [id, subject, preview, when]
      properties:
        id:
          type: string
        subject:
          type: string
        preview:
          type: string
        when:
          type: string
        unread:
          type: boolean
    Person:
      type: object
      required: [id, name, initials, email, slot, latest, when, writesTo, since, tags, conversations]
      properties:
        id:
          type: string
        name:
          type: string
        initials:
          type: string
        email:
          type: string
        slot:
          $ref: "#/components/schemas/AccountSlot"
        latest:
          type: string
        when:
          type: string
        writesTo:
          type: string
        since:
          type: string
        tags:
          type: array
          items:
            type: string
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
    Rule:
      type: object
      required: [id, when, then, thenToken, matches, on]
      properties:
        id:
          type: string
        when:
          type: string
        whenToken:
          type: string
        whenTail:
          type: string
        then:
          type: string
        thenToken:
          type: string
        thenColor:
          $ref: "#/components/schemas/TagColor"
        matches:
          type: integer
        on:
          type: boolean
    Check:
      type: object
      required: [id, name, description, builtIn, on]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        builtIn:
          type: boolean
        on:
          type: boolean
    CheckDetail:
      allOf:
        - $ref: "#/components/schemas/Check"
        - type: object
          required: [prompt, sureness, runsOn, usedBy]
          properties:
            prompt:
              type: string
            sureness:
              type: string
              enum: [eager, balanced, careful]
            runsOn:
              type: array
              items:
                type: string
            usedBy:
              type: string
    HealthOverview:
      type: object
      required: [accounts, searchIndex, meaningSearch, storage]
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        searchIndex:
          type: string
        meaningSearch:
          type: string
        storage:
          type: string
    HiddenMail:
      type: object
      description: Mail the mirror keeps but does not show (ARCHITECTURE.md 4)
      required: [total, moved, removed, pending]
      properties:
        total:
          type: integer
        moved:
          type: integer
          description: Hidden because the message moved to another folder, so it is still on the server
        removed:
          type: integer
          description: Hidden because the server no longer holds the message
        pending:
          type: integer
          description: >
            Hidden by a pass that has not classified it yet. Not restorable and
            not counted by the mass-disable alert until a completed pass settles it.
    RestoreResult:
      type: object
      required: [restored]
      properties:
        restored:
          type: integer
    OutboxAction:
      type: object
      required: [messageId, action]
      properties:
        messageId:
          type: string
          description: The mirror row the action applies to
        action:
          type: string
          enum: [archive, trash, spam, not_junk, flag, unflag, seen, unseen, move, expunge, tag, untag]
          x-enum-varnames:
            [OutboxActionArchive, OutboxActionTrash, OutboxActionSpam, OutboxActionNotJunk,
             OutboxActionFlag, OutboxActionUnflag, OutboxActionSeen, OutboxActionUnseen,
             OutboxActionMove, OutboxActionExpunge, OutboxActionTag, OutboxActionUntag]
        destinationFolderId:
          type: string
          description: The destination folder for `move` (an undo sends the source folder back)
        tagId:
          type: string
          description: >
            The tag for `tag` and `untag`. Tagging is the `$ivy-<slug>` keyword written
            to the server; `untag` clears it from every live copy of the message.
    OutboxItem:
      type: object
      description: One outbox op, naming a postcondition rather than a command
      required: [id, accountId, messageId, kind, state, attempts, createdAt, updatedAt]
      properties:
        id:
          type: string
        accountId:
          type: string
        messageId:
          type: string
          description: The mirror row id, resolved from the content key and folder
        seq:
          type: integer
        kind:
          type: string
          enum: [flags, move, expunge]
          x-enum-varnames: [OutboxKindFlags, OutboxKindMove, OutboxKindExpunge]
        state:
          type: string
          enum: [pending, in_flight, done, failed, cancelled]
          x-enum-varnames:
            [OutboxStatePending, OutboxStateInFlight, OutboxStateDone, OutboxStateFailed, OutboxStateCancelled]
        sourceFolderId:
          type: string
        destinationFolderId:
          type: string
        flagsAdd:
          type: array
          items:
            type: string
        flagsClear:
          type: array
          items:
            type: string
        attempts:
          type: integer
        lastErrorCode:
          type: string
        lastErrorDetail:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    OutboxList:
      type: object
      required: [active, recent]
      properties:
        active:
          type: array
          items:
            $ref: "#/components/schemas/OutboxItem"
        recent:
          type: array
          items:
            $ref: "#/components/schemas/OutboxItem"
