        never supplies a filename.
      required: [id]
      properties:
        id:
          type: string
          description: A staged upload id from POST /accounts/{id}/uploads.
        inline:
          type: boolean
          description: "Place the image in the body as a cid: part."
    BodyFormat:
      type: string
      description: >
        How `text` is interpreted. `plain` is a text/plain part only;
        `markdown` renders the text with goldmark into a text/html part;
        `html` treats the text as HTML, narrows it with the compose-only policy
        and derives a text/plain alternative. Absent means `markdown` when the
        legacy `markdown: true` flag is set, else `plain`.
      enum: [plain, markdown, html]
