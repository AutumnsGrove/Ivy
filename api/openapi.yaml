            [OutboxBatchActionArchive, OutboxBatchActionTrash, OutboxBatchActionSpam, OutboxBatchActionNotJunk,
             OutboxBatchActionFlag, OutboxBatchActionUnflag, OutboxBatchActionSeen, OutboxBatchActionUnseen,
             OutboxBatchActionMove, OutboxBatchActionTag, OutboxBatchActionUntag]
