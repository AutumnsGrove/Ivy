<!doctype html>

<style>
body{margin:0}
.ivy,.ivy *{box-sizing:border-box}

.glass-strong{background:var(--glass-strong);border:1px solid var(--glass-border);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:15px;height:15px}
.row{display:flex;align-items:center}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:22px;font:500 14px 'Lexend',system-ui,sans-serif;border:1px solid var(--glass-border);color:var(--text);background:transparent;padding:0 20px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.skel{height:12px;border-radius:6px;background:rgba(255,255,255,0.07);margin-bottom:12px}
</style>
</helmet>

<div class="ivy" style="position:relative;width:390px;height:844px;overflow:hidden;font-family:'Lexend',system-ui,sans-serif;color:var(--text);--text:#f2eddc;--muted:#b9c6bc;--faint:#8ea296;--glass-strong:rgba(10,22,19,0.86);--glass-border:rgba(190,235,208,0.15);--accent:#c4b5fd;--accent-soft:rgba(196,181,253,0.16);--accent-line:rgba(196,181,253,0.40);--on-accent:#1b1238;--panel:rgba(8,18,15,0.88)">
  <div class="scene" style="background-color:#070d11;background-image:url(assets/vines.svg),url(assets/vines.svg),url(assets/vines.svg),linear-gradient(180deg,#070d13 0%,#0a1613 50%,#0c1f18 100%);background-size:450px 450px,450px 450px,450px 450px,100% 100%;background-repeat:repeat,repeat,repeat,no-repeat"></div>
  <div class="stars"></div>

  <div style="position:absolute;left:8px;right:8px;top:14px;display:flex;align-items:center">
    <button class="iconbtn" aria-label="Back"><svg class="ic" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></button>
    <span style="flex-grow:1"></span>
    <button class="iconbtn" aria-label="More"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
  </div>

  <div style="position:absolute;left:12px;right:12px;top:66px;bottom:92px;border-radius:26px;background:var(--panel);border:1px solid var(--glass-border);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding:22px 20px;overflow:hidden">
    <div style="font-family:'Newsreader',Georgia,serif;font-size:27px;line-height:1.22;font-weight:500">Moving my blog over to Grove?</div>
    <div class="row" style="gap:12px;margin-top:16px">
      <div style="width:40px;height:40px;border-radius:50%;background:rgba(240,166,202,0.16);border:1px solid rgba(240,166,202,0.45);color:#f0a6ca;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px;flex:none">ML</div>
      <div><div style="font-size:14.5px;font-weight:500">Mara Linden</div><div style="font-size:12px;color:var(--muted);margin-top:2px">to hello@ · 9:41</div></div>
    </div>

    <!-- the body could not be loaded -->
    <div style="margin-top:24px;border-radius:20px;border:1px solid rgba(242,149,127,0.35);background:rgba(242,149,127,0.07);padding:20px 18px;text-align:center">
      <svg class="ic" viewBox="0 0 24 24" style="width:30px;height:30px;color:#f2957f;stroke-width:1.5"><path d="m2 2 20 20"></path><path d="M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.307-.193"></path><path d="M21.532 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7.008 7.008 0 0 0 10 5.07"></path></svg>
      <div style="font-family:'Newsreader',Georgia,serif;font-size:20px;font-weight:500;margin-top:10px">This message didn't load</div>
      <div style="font-size:13.5px;color:var(--muted);line-height:1.5;margin:6px 0 16px">Ivy couldn't fetch the full text from Purelymail just now. The message is still there.</div>
      <div class="row" style="gap:10px;justify-content:center"><button class="btn primary">Try again</button><button class="btn">Show what we have</button></div>
    </div>

    <!-- one attachment could not be loaded, the rest are fine -->
    <div style="margin-top:20px;font-size:11px;font-weight:500;letter-spacing:0.09em;text-transform:uppercase;color:var(--faint)">Attachments</div>
    <div class="row" style="gap:12px;margin-top:8px;padding:10px 12px;border-radius:14px;border:1px solid var(--glass-border)">
      <svg class="ic" viewBox="0 0 24 24" style="color:var(--faint)"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
      <div style="flex-grow:1;min-width:0"><div style="font-size:13.5px">post-photo.jpg</div><div style="font-size:11.5px;color:#f2957f">Couldn't load</div></div>
      <span style="font-size:13px;color:var(--accent)">Retry</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
