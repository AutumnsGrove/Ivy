<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tag, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&amp;family=Newsreader:ital,wght@0,400;0,500;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ivy,.ivy *{box-sizing:border-box}
.scene{position:absolute;left:0;top:0;width:100%;height:100%}
.stars{position:absolute;left:0;top:0;width:100%;height:380px;background:url(assets/stars.svg) repeat-x top left;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.glass{background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
.glass-strong{background:var(--glass-strong);border:1px solid var(--glass-border);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:15px;height:15px}
.row{display:flex;align-items:center}
.lbl{display:block;font:500 12px 'Lexend',system-ui,sans-serif;color:var(--muted);margin:0 4px 8px}
.inp{display:flex;align-items:center;height:52px;padding:0 16px;border-radius:16px;font:400 15px 'Lexend',system-ui,sans-serif;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border)}
.sw{width:100%;aspect-ratio:1/1;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.12)}
.sw.on{box-shadow:0 0 0 3px var(--glass-strong),0 0 0 5px var(--text)}
.tog{position:relative;width:46px;height:28px;border-radius:14px;background:rgba(255,255,255,0.1);border:1px solid var(--glass-border);flex:none}
.tog i{position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--muted)}
.chipv{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 10px;border-radius:15px;font:400 13.5px 'Lexend',system-ui,sans-serif}
.btn{display:inline-flex;align-items:center;justify-content:center;height:50px;border-radius:25px;font:500 15px 'Lexend',system-ui,sans-serif;border:1px solid var(--glass-border);color:var(--text);background:transparent;flex:1}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
</style>
</helmet>

<div class="ivy" style="position:relative;width:390px;height:844px;overflow:hidden;font-family:'Lexend',system-ui,sans-serif;color:var(--text);--text:#f2eddc;--muted:#b9c6bc;--faint:#8ea296;--glass:rgba(14,30,26,0.58);--glass-strong:rgba(10,22,19,0.92);--glass-border:rgba(190,235,208,0.15);--accent:#c4b5fd;--accent-soft:rgba(196,181,253,0.16);--accent-line:rgba(196,181,253,0.40);--on-accent:#1b1238">
  <div class="scene" style="background-color:#070d11;background-image:url(assets/vines.svg),url(assets/vines.svg),url(assets/vines.svg),linear-gradient(180deg,#070d13 0%,#0a1613 50%,#0c1f18 100%);background-size:450px 450px,450px 450px,450px 450px,100% 100%;background-repeat:repeat,repeat,repeat,no-repeat"></div>
  <div class="stars"></div>

  <!-- the Tags screen, dimmed behind -->
  <div style="position:absolute;left:18px;right:14px;top:16px;font-size:26px;font-weight:300;opacity:0.5">Tags</div>
  <div class="glass" style="position:absolute;left:14px;right:14px;top:78px;height:200px;border-radius:20px;opacity:0.5"></div>
  <div style="position:absolute;left:0;top:0;width:390px;height:844px;background:rgba(2,6,5,0.55)"></div>

  <!-- sheet -->
  <div class="glass-strong" style="position:absolute;left:0;right:0;bottom:0;height:700px;border-radius:28px 28px 0 0;border-bottom:0;padding:10px 18px 24px">
    <div style="width:40px;height:4px;border-radius:2px;background:rgba(242,237,220,0.25);margin:0 auto 14px"></div>
    <div class="row" style="margin:0 4px 18px">
      <div style="flex-grow:1;font-size:20px;font-weight:300">New tag</div>
      <span class="chipv" style="background:{{tint}};border:1px solid {{line}};color:{{color}}"><svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"></path><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"></circle></svg>ideas</span>
    </div>

    <label class="lbl">Name</label>
    <div class="inp">ideas</div>

    <label class="lbl" style="margin-top:22px">Colour</label>
    <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 12px;padding:4px 6px">
      <sc-for list="{{swatches}}" as="s" hint-placeholder-count="12">
        <span class="{{s.cls}}" style="background:{{s.color}}"><sc-if value="{{s.on}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 24 24" style="color:#10101a;width:18px;height:18px;stroke-width:2.5"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>
      </sc-for>
    </div>
    <div class="row" style="gap:10px;margin:16px 4px 0;font-size:12.5px;color:var(--faint)">
      <span style="width:14px;height:14px;border-radius:50%;background:conic-gradient(#f0a6ca,#f5c45a,#86efac,#7cc4ff,#c4b5fd,#f0a6ca);flex:none"></span>
      Custom colour…
      <span style="flex-grow:1"></span>
      <span>Each colour has a matching shade for day</span>
    </div>

    <div class="glass row" style="gap:12px;border-radius:18px;padding:12px 14px;margin-top:24px">
      <div style="flex-grow:1"><div style="font-size:14.5px">Tag matching mail automatically</div><div style="font-size:12px;color:var(--faint);margin-top:2px">Set up a rule after saving</div></div>
      <span class="tog"><i></i></span>
    </div>

    <div class="row" style="gap:10px;margin-top:28px">
      <button class="btn">Cancel</button>
      <button class="btn primary" style="flex:1.4">Create tag</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"selected":{"editor":"int","default":4,"min":0,"max":11,"section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const palette = ['#7cc4ff', '#f0a6ca', '#5ad1c8', '#f2957f', '#c4b5fd', '#86efac', '#f5c45a', '#e5d3a8', '#e9a8f0', '#a3c97a', '#a9b8c6', '#e07a9b'];
    const sel = this.props.selected ?? 4;
    const hexToRgb = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).join(',');
    const color = palette[sel];
    return {
      color,
      tint: 'rgba(' + hexToRgb(color) + ',0.14)',
      line: 'rgba(' + hexToRgb(color) + ',0.45)',
      swatches: palette.map((c, i) => ({ color: c, on: i === sel, cls: i === sel ? 'sw on' : 'sw' })),
    };
  }
}
</script>
</body>
</html>
