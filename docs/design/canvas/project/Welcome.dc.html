<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First run, welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&amp;family=Newsreader:ital,wght@0,400;0,500;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ivy,.ivy *{box-sizing:border-box}
.scene{position:absolute;left:0;top:0;width:100%;height:100%}
.stars{position:absolute;left:0;top:0;width:100%;height:520px;background:url(assets/stars.svg) repeat-x top left;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fire{position:absolute;width:5px;height:5px;border-radius:50%;background:#f7dc92;box-shadow:0 0 10px 3px rgba(247,220,146,0.55);opacity:0.2;animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0);opacity:0.15}50%{opacity:0.85}100%{transform:translate(20px,-30px);opacity:0.15}}
.halo{position:absolute;left:95px;top:210px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(196,181,253,0.28),rgba(196,181,253,0) 68%);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(0.94);opacity:0.7}50%{transform:scale(1.06);opacity:1}}
@media (prefers-reduced-motion: reduce){.fire,.halo{animation:none}.fire{opacity:0.4}}
</style>
</helmet>

<div class="ivy" style="position:relative;width:390px;height:844px;overflow:hidden;font-family:'Lexend',system-ui,sans-serif;color:var(--text);--text:#f2eddc;--muted:#b9c6bc;--faint:#8ea296;--accent:#c4b5fd;--accent-soft:rgba(196,181,253,0.16);--accent-line:rgba(196,181,253,0.40);--on-accent:#1b1238">
  <div class="scene" style="background-color:#070d11;background-image:url(assets/vines.svg),url(assets/vines.svg),url(assets/vines.svg),linear-gradient(180deg,#070d13 0%,#0a1613 50%,#0c1f18 100%);background-size:450px 450px,450px 450px,450px 450px,100% 100%;background-repeat:repeat,repeat,repeat,no-repeat"></div>
  <div class="stars"></div>
  <div class="fire" style="left:60px;top:470px;animation-delay:0s"></div>
  <div class="fire" style="left:316px;top:520px;animation-delay:2.5s"></div>
  <div class="fire" style="left:200px;top:640px;animation-delay:5s"></div>
  <div class="halo"></div>

  <svg class="ic" viewBox="0 0 24 24" style="position:absolute;left:155px;top:270px;width:80px;height:80px;color:var(--accent);stroke-width:1.25"><path d="M7 20h10"></path><path d="M10 20c5.5-2.5.8-6.4 3-10"></path><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"></path><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"></path></svg>

  <div style="position:absolute;left:0;right:0;top:420px;text-align:center;padding:0 36px">
    <div style="font-size:48px;font-weight:300;letter-spacing:0.06em">Ivy</div>
    <div style="font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:20px;line-height:1.5;color:var(--muted);margin-top:8px">A quiet place for your mail.</div>
  </div>

  <div style="position:absolute;left:24px;right:24px;bottom:52px;display:flex;flex-direction:column;gap:14px;align-items:center">
    <button style="width:100%;height:56px;border-radius:28px;border:0;background:var(--accent);color:var(--on-accent);font:500 16px 'Lexend',system-ui,sans-serif;box-shadow:0 0 0 6px var(--accent-soft)">Connect your first account</button>
    <div style="font-size:12.5px;color:var(--faint);text-align:center;line-height:1.5">Your mail stays on your own server.<br>Nothing is sent anywhere until you say so.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
