  <!-- four-point sparkles -->
  <g fill="#fbf4da" opacity="0.9">
    <path d="M170 46 L171 49 L174 50 L171 51 L170 54 L169 51 L166 50 L169 49 Z" transform="translate(0 -4)"></path>
    <path d="M58 150 L59 153 L62 154 L59 155 L58 158 L57 155 L54 154 L57 153 Z" opacity="0.7"></path>
    <path d="M262 128 L263 131 L266 132 L263 133 L262 136 L261 133 L258 132 L261 131 Z" opacity="0.75"></path>
    <path d="M344 190 L345 192 L347 193 L345 194 L344 196 L343 194 L341 193 L343 192 Z" opacity="0.6"></path>
  </g>

  <!-- moon -->
  <circle cx="312" cy="88" r="62" fill="url(#moonglow)"></circle>
  <circle cx="310" cy="90" r="18" fill="#efe9d2" opacity="0.88" mask="url(#crescent)"></circle>

  <!-- distant hills -->
