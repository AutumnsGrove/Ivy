    <path d="M44 690 V646 Q44 636 56 636 H122 V608 Q122 548 195 526 Q268 548 268 608 V636 H334 Q346 636 346 646 V690 Z" fill="#0b1a15" stroke="#9fe2bc" stroke-opacity="0.16" stroke-width="1"></path>
    <path d="M122 636 V690 M268 636 V690 M195 526 V690 M158 538 V690 M232 538 V690 M92 636 V690 M298 636 V690" stroke="#9fe2bc" stroke-opacity="0.09" stroke-width="1" fill="none"></path>
    <path d="M44 662 H346 M122 590 H268 M134 566 H256" stroke="#9fe2bc" stroke-opacity="0.07" stroke-width="1" fill="none"></path>
    <rect x="160" y="640" width="34" height="50" fill="#f7dc92" opacity="0.07"></rect>
    <rect x="198" y="600" width="34" height="40" fill="#f7dc92" opacity="0.05"></rect>
  </g>

  <!-- mid garden: ferns and blades -->
  <g fill="#0e261d">
