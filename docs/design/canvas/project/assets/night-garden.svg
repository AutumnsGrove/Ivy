<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060b10"></stop>
      <stop offset="0.5" stop-color="#091611"></stop>
      <stop offset="1" stop-color="#0c1f18"></stop>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9f3dc" stop-opacity="0.22"></stop>
      <stop offset="1" stop-color="#e9f3dc" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7dc92" stop-opacity="0.16"></stop>
      <stop offset="1" stop-color="#f7dc92" stop-opacity="0"></stop>
    </radialGradient>
    <mask id="crescent">
      <rect x="0" y="0" width="390" height="844" fill="#ffffff"></rect>
      <circle cx="318" cy="84" r="16" fill="#000000"></circle>
    </mask>
