    <use xlink:href="#leaf" href="#leaf" transform="translate(-6 770) rotate(-38) scale(1.3)"></use>
    <use xlink:href="#leaf" href="#leaf" transform="translate(-6 770) rotate(-16) scale(1)"></use>
  </g>

  <!-- right foreground -->
  <g fill="#081611">
    <use xlink:href="#leaf" href="#leaf" transform="translate(396 760) rotate(-108) scale(1.5) scale(-1 1)"></use>
    <use xlink:href="#leaf" href="#leaf" transform="translate(396 760) rotate(-130) scale(1.7) scale(-1 1)"></use>
    <use xlink:href="#leaf" href="#leaf" transform="translate(396 760) rotate(-152) scale(1.6) scale(-1 1)"></use>
    <use xlink:href="#leaf" href="#leaf" transform="translate(396 760) rotate(-172) scale(1.3) scale(-1 1)"></use>
    <use xlink:href="#leaf" href="#leaf" transform="translate(360 770) rotate(-118) scale(1.1) scale(-1 1)"></use>
    <use xlink:href="#leaf" href="#leaf" transform="translate(360 770) rotate(-144) scale(1.2) scale(-1 1)"></use>
