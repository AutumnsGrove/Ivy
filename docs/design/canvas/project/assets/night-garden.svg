  </g>
  <path d="M0 700 C70 690 130 706 200 698 C270 690 330 704 390 694 L390 844 L0 844 Z" fill="#0a1d16"></path>

  <!-- left foreground: palm / fern fronds -->
  <g fill="#081611">
    <use xlink:href="#leaf" href="#leaf" transform="translate(-6 770) rotate(-72) scale(1.5)"></use>
    <use xlink:href="#leaf" href="#leaf" transform="translate(-6 770) rotate(-50) scale(1.7)"></use>
    <use xlink:href="#leaf" href="#leaf" transform="translate(-6 770) rotate(-28) scale(1.6)"></use>
    <use xlink:href="#leaf" href="#leaf" transform="translate(-6 770) rotate(-8) scale(1.3)"></use>
    <use xlink:href="#leaf" href="#leaf" transform="translate(30 760) rotate(-62) scale(1.1)"></use>
    <use xlink:href="#leaf" href="#leaf" transform="translate(30 760) rotate(-36) scale(1.2)"></use>
    <use xlink:href="#leaf" href="#leaf" transform="translate(30 760) rotate(-14) scale(1)"></use>
  </g>
  <g fill="#0b1f18">
