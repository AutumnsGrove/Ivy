    <circle cx="131" cy="74" r="0.5" opacity="0.5"></circle>
    <circle cx="170" cy="46" r="1" opacity="0.85"></circle>
    <circle cx="204" cy="112" r="0.6" opacity="0.55"></circle>
    <circle cx="236" cy="30" r="0.7" opacity="0.7"></circle>
    <circle cx="268" cy="68" r="0.5" opacity="0.5"></circle>
    <circle cx="352" cy="38" r="0.8" opacity="0.7"></circle>
    <circle cx="372" cy="132" r="0.6" opacity="0.5"></circle>
    <circle cx="14" cy="150" r="0.7" opacity="0.6"></circle>
    <circle cx="74" cy="188" r="0.5" opacity="0.45"></circle>
    <circle cx="118" cy="160" r="0.9" opacity="0.7"></circle>
    <circle cx="160" cy="206" r="0.5" opacity="0.4"></circle>
    <circle cx="214" cy="176" r="0.7" opacity="0.55"></circle>
    <circle cx="258" cy="214" r="0.6" opacity="0.45"></circle>
    <circle cx="300" cy="170" r="0.5" opacity="0.5"></circle>
    <circle cx="344" cy="226" r="0.8" opacity="0.6"></circle>
    <circle cx="30" cy="262" r="0.6" opacity="0.4"></circle>
    <circle cx="88" cy="300" r="0.5" opacity="0.35"></circle>
    <circle cx="146" cy="268" r="0.7" opacity="0.45"></circle>
    <circle cx="196" cy="318" r="0.5" opacity="0.3"></circle>
    <circle cx="246" cy="286" r="0.6" opacity="0.4"></circle>
    <circle cx="292" cy="330" r="0.5" opacity="0.3"></circle>
    <circle cx="366" cy="290" r="0.7" opacity="0.4"></circle>
    <circle cx="48" cy="360" r="0.5" opacity="0.3"></circle>
    <circle cx="322" cy="372" r="0.5" opacity="0.3"></circle>
    <circle cx="110" cy="396" r="0.4" opacity="0.25"></circle>
    <circle cx="228" cy="402" r="0.4" opacity="0.25"></circle>
